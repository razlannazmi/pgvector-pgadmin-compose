services:
  postgres:
    # Pinned: pgvector 0.8.6, Postgres 18, Debian bookworm. The OS is pinned
    # too because a glibc change (e.g. bookworm -> trixie) can alter text
    # collation order and silently corrupt indexes. Bump deliberately.
    image: pgvector/pgvector:0.8.6-pg18-bookworm
    container_name: pgvector18
    restart: unless-stopped
    stop_grace_period: 1m
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # Bind mount -> host path is backed by setup-volume.sh, either a
      # size-capped loopback filesystem or the plain host filesystem,
      # depending on volume.conf. Data survives container removal either way.
      - /var/lib/postgresql/18/data:/var/lib/postgresql/data
    ports:
      # Bound to all interfaces so other apps/servers can connect directly.
      # Make sure the host firewall / security group only allows 5432 from
      # trusted IPs, and use a strong POSTGRES_PASSWORD in .env.
      - "0.0.0.0:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  pgadmin4:
    image: dpage/pgadmin4:9.18.0
    container_name: pgadmin4
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: "False"
      PGADMIN_CONFIG_SESSION_COOKIE_SECURE: "False"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
      PGADMIN_CONFIG_WTF_CSRF_ENABLED: "True"
      PGADMIN_CONFIG_CONSOLE_LOG_LEVEL: "30"
      PGADMIN_DISABLE_POSTFIX: "1"
      PGADMIN_LISTEN_PORT: "80"
      SCRIPT_NAME: /pgadmin4
    volumes:
      # Named volume: small config store, no need for a predictable host path.
      - pgadmin_data:/var/lib/pgadmin
    ports:
      # Localhost only: not reachable at <server-ip>:5050. Reach it through a
      # reverse proxy on the same host (proxy to http://127.0.0.1:5050/pgadmin4)
      # or an SSH tunnel (ssh -L 5050:localhost:5050 <host>).
      - "127.0.0.1:5050:80"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgadmin_data:
